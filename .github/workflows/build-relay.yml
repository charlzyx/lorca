# 构建 lorca-relay（Linux x86_64，musl 静态链接），产物上传为 artifact
name: Build Relay

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/relay

      - name: Build lorca-relay (static musl)
        run: cargo build --release -p lorca-relay --target x86_64-unknown-linux-musl

      - name: Smoke test
        run: ./target/x86_64-unknown-linux-musl/release/lorca-relay --help | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: lorca-relay-linux-amd64-musl
          path: target/x86_64-unknown-linux-musl/release/lorca-relay
          if-no-files-found: error
