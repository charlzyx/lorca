# 构建 lorca-relay（Linux x86_64），产物上传为 artifact
name: Build Relay

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/relay

      - name: Build lorca-relay
        run: cargo build --release -p lorca-relay

      - name: Smoke test
        run: ./target/release/lorca-relay --help | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: lorca-relay-linux-amd64
          path: target/release/lorca-relay
          if-no-files-found: error
